name: One-time fulfillment README checkpoint

on:
  push:
    branches:
      - foundation/bootstrap
    paths:
      - .github/workflows/fulfillment-readme.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: foundation/bootstrap

      - name: Patch README and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()

          s = s.replace(
            '- First tax-invoice web workspace: **implemented**\n',
            '- First tax-invoice web workspace: **implemented**\n- Atomic full sales-invoice stock fulfilment: **implemented + CI green**\n'
          )
          s = s.replace(
            '- `20261030001300_financial_line_calculation.sql`\n',
            '- `20261030001300_financial_line_calculation.sql`\n- `20261030001400_sales_fulfillment.sql`\n'
          )
          s = s.replace(
            '- `008_organization_billing_profiles.test.sql` — 22 assertions\n',
            '- `008_organization_billing_profiles.test.sql` — 22 assertions\n- `009_sales_fulfillment.test.sql` — 19 assertions\n'
          )
          s = s.replace(
            'The browser never sends authoritative taxable values or tax amounts.\n',
            'The browser never sends authoritative taxable values or tax amounts. Invoice lines can now bind to active inventory items, preserving an item snapshot. Issued stock-backed invoices can be fulfilled from an active warehouse; the fulfilment posts all stock-backed lines atomically and is idempotent.\n'
          )
          s = s.replace(
            '- Sales invoice issue does **not yet post inventory** automatically.\n',
            '- Financial invoice issue and physical stock fulfilment are intentionally separate business events. V1 supports one full atomic fulfilment per issued tax invoice; partial fulfilment and returns/reversals are pending.\n'
          )
          s = s.replace(
            '1. Connect issued **sales tax invoices to inventory posting** with one transactional/idempotent database workflow; do not let invoice issue and stock movement diverge.\n2. Add stock-item selection to invoice lines while retaining immutable item snapshots on issue.\n3. Decide whether stock should post exactly at invoice issue or via an explicit fulfilment/delivery state; document the business invariant before coding.\n4. Add adversarial pgTAP tests for double issue/retry/concurrent issue and stock availability.\n5. Add payments + allocations against issued invoices.\n6. Add PDF/print rendering from immutable issued snapshots.\n7. Add Playwright E2E for organization -> customer -> seller profile -> draft -> line -> issue -> cancel.\n8. Keep database and application gates green after every milestone.\n',
            '1. Add **payments + allocations** against issued invoices with exact decimal arithmetic, tenant isolation, immutable payment history and over-allocation protection.\n2. Add invoice balance/status reads (unpaid/part-paid/paid) derived from allocations.\n3. Add payment API + invoice UI for recording and allocating receipts.\n4. Add PDF/print rendering from immutable issued snapshots.\n5. Add returns/stock-reversal workflow before allowing fulfilled invoices to be financially cancelled.\n6. Add partial fulfilment only after the full-fulfilment invariant is stable.\n7. Add Playwright E2E for organization -> customer -> seller profile -> draft -> stock line -> issue -> fulfil -> payment.\n8. Keep database and application gates green after every milestone.\n'
          )
          p.write_text(s)
          PY

          git rm .github/workflows/fulfillment-readme.yml
          git config user.name "Inventory CI"
          git config user.email "inventory-ci@users.noreply.github.com"
          git add README.md
          git commit -m "docs: record atomic sales fulfillment milestone"
          git push origin HEAD:foundation/bootstrap
