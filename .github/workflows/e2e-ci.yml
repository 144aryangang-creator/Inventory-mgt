name: Browser E2E

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/e2e-ci.yml'
  push:
    branches:
      - main
      - 'foundation/**'
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/e2e-ci.yml'

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Real-stack Chromium critical path
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_EMAIL: e2e-user@example.test
      E2E_PASSWORD: LocalE2E-Password-2026!
      E2E_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # pinned snapshot
        with:
          version: 2.122.0

      - name: Start minimal local Supabase app stack
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Configure local app environment
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          if [ -z "$API_URL" ] || [ -z "$PUBLIC_KEY" ]; then
            echo "Supabase API URL or public key is missing" >&2
            exit 1
          fi

          cat > apps/api/.dev.vars <<EOF
          APP_ORIGIN=http://127.0.0.1:4173
          SUPABASE_URL=$API_URL
          SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY
          EOF

          cat > apps/web/.env.local <<EOF
          VITE_SUPABASE_URL=$API_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY
          VITE_API_BASE_URL=http://127.0.0.1:8787
          EOF

          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_PUBLIC_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Create ephemeral E2E user
        shell: bash
        run: |
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST "$E2E_SUPABASE_URL/auth/v1/signup" \
            --header "apikey: $E2E_SUPABASE_PUBLIC_KEY" \
            --header "Authorization: Bearer $E2E_SUPABASE_PUBLIC_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\"}")
          echo "$RESPONSE" | jq -e '.user.id' >/dev/null

      - name: Run Playwright critical path
        run: npm run e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
