name: One-time customer payment API mount

on:
  push:
    branches:
      - foundation/bootstrap
    paths:
      - .github/workflows/mount-payment-api.yml

permissions:
  contents: write

jobs:
  mount:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: foundation/bootstrap

      - name: Patch exports and worker, then remove workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          package_path = Path('packages/contracts/package.json')
          package = json.loads(package_path.read_text())
          package['exports']['./customer-payments'] = './src/customer-payments.ts'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          worker_path = Path('apps/api/src/worker.ts')
          worker = worker_path.read_text()
          if "./customer-payments" not in worker:
              worker = worker.replace(
                  "import app from './index'\n",
                  "import app from './index'\nimport { customerPaymentRoutes } from './customer-payments'\n",
              )
          if "app.route('/v1/customer-payments'" not in worker:
              worker = worker.replace(
                  "app.route('/v1/financial-documents', financialDocumentRoutes)\n",
                  "app.route('/v1/customer-payments', customerPaymentRoutes)\napp.route('/v1/financial-documents', financialDocumentRoutes)\n",
              )
          worker_path.write_text(worker)
          PY

          git rm .github/workflows/mount-payment-api.yml
          git config user.name "Inventory CI"
          git config user.email "inventory-ci@users.noreply.github.com"
          git add packages/contracts/package.json apps/api/src/worker.ts
          git commit -m "feat(api): mount customer payment routes"
          git push origin HEAD:foundation/bootstrap
