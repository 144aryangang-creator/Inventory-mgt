name: Database CI

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-ci.yml'
  push:
    branches:
      - main
      - 'foundation/**'
    paths:
      - 'supabase/**'
      - '.github/workflows/database-ci.yml'

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations, lint, and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1 branch snapshot
        with:
          version: 2.122.0

      # Database CI does not need API gateway, Auth server, Studio, Storage,
      # Realtime, Functions, analytics, mail, metadata, vector or pooler services.
      # Keeping only Postgres reduces CI startup time and external image pulls.
      - name: Start local Supabase database
        run: >-
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Lint database
        run: supabase db lint --local --level warning --fail-on error --schema public

      - name: Run database tests
        run: supabase test db --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
